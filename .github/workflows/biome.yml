name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 固定版本，避免 latest 拉到 2.6.2（引入对 Markdown 的新格式化/解析行为，
          # 曾批量误报 146+ 个 .md 文件 + LaTeX 公式解析错误）。
          # 注意：setup-biome 只认有 GitHub Release 的版本——2.6.0/2.6.1 在 npm 有包
          # 但没有 release，会报 "Version does not exist"。2.5.15 是最新的干净 release。
          # 升级 Biome 时请同步更新 package.json 的 @biomejs/biome 版本号。
          version: 2.5.15
      - name: Run Biome
        run: biome ci ./src --reporter=github
