<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档 - InvernoFrio的博客</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">  <link rel="alternate" type="application/rss+xml" title="InvernoFrio的博客 RSS" href="feed.xml">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="logo">🌾 InvernoFrio的博客</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">首页</a></li>
        <li><a href="categories.html">分类</a></li>
        <li><a href="archive.html">归档</a></li>
        <li><a href="search.html">搜索</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="friend-links.html">友链</a></li>
        <li><a href="toolbox.html">百宝箱</a></li>
        <li><a href="contact.html">联系</a></li>
      </ul>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
      </div>
    </div>
  </nav>

  <!-- 封面 -->
  <header class="cover">
    <div class="cover-content">
      <h1 class="cover-title" id="coverTitle" data-title="归档"></h1>
      <p class="cover-subtitle">按时间线浏览所有文章</p>
    </div>
  </header>

  <main class="container article-page">
    <article class="article-card">
      <a href="index.html" class="back-link">← 返回首页</a>
      <div class="article-body">
        <div class="archive-timeline" id="archiveTimeline">
          <p class="search-hint">加载中…</p>
        </div>
      </div>
    </article>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 InvernoFrio的博客 · 用 Nginx 构建 · <a href="http://REDACTED_IP">主站</a></p>
    </div>
  </footer>

  <script>
    const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月',
                        '七月', '八月', '九月', '十月', '十一月', '十二月'];

    function parseDate(str) {
      const m = str.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if (!m) return new Date(0);
      return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }

    const categoryMap = { '摄影': 'photography', '矩阵优化与计算': 'matrix' };

    fetch('search-data.json')
      .then(res => res.json())
      .then(data => {
        data.sort((a, b) => parseDate(b.date) - parseDate(a.date));
        const groups = {};
        data.forEach(article => {
          const d = parseDate(article.date);
          const yearKey = d.getFullYear();
          const monthKey = d.getMonth();
          const groupKey = yearKey + '-' + monthKey;
          if (!groups[groupKey]) groups[groupKey] = { year: yearKey, month: monthKey, articles: [] };
          groups[groupKey].articles.push(article);
        });
        const keys = Object.keys(groups).sort((a, b) => {
          const pa = a.split('-').map(Number);
          const pb = b.split('-').map(Number);
          return pb[0] - pa[0] || pb[1] - pa[1];
        });
        let html = '';
        let currentYear = null;
        keys.forEach(key => {
          const group = groups[key];
          if (group.year !== currentYear) {
            currentYear = group.year;
            html += '<h2 class="archive-year">' + currentYear + '</h2>';
          }
          html += '<h3 class="archive-month">' + monthNames[group.month] + '</h3>';
          group.articles.forEach(article => {
            const d = parseDate(article.date);
            const dayStr = (d.getMonth() + 1) + '/' + d.getDate();
            const catSlug = categoryMap[article.category] || 'uncategorized';
            html += '<div class="archive-item">' +
              '<span class="archive-date">' + dayStr + '</span>' +
              '<span class="archive-title"><a href="' + article.url + '">' + article.title + '</a></span>' +
              '<a href="category-' + catSlug + '.html" class="archive-tag">' + article.category + '</a>' +
              '</div>';
          });
        });
        document.getElementById('archiveTimeline').innerHTML = html;
      })
      .catch(() => {
        document.getElementById('archiveTimeline').innerHTML = '<p class="search-hint">加载文章数据失败</p>';
      });
  </script>
  <script src="js/common.js"></script>
</body>
</html>
