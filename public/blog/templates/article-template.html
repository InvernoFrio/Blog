</head>
<body>

          </nav>
        </div>
      </aside>

      <!-- 右侧文章 -->
      <article class="article-card">
        <a href="index.html" class="back-link">← 返回首页</a>
        <div class="article-meta">
          <a href="category-xxx.html" class="tag">分类名</a>
          <span class="meta-date">2026年X月X日</span>
        </div>
        <h1>文章标题</h1>

        <div class="article-body">

          <h2 id="sec-1">1. 小节一</h2>
          <p>正文内容。支持行内公式 $E = mc^2$ 和块级公式：</p>
          $$\sum_{i=1}^n x_i = n \bar{x}$$

          <h2 id="sec-2">2. 小节二</h2>

          <p>支持图片：</p>

        <!-- 评论区 -->
        <div class="comment-section" style="border-top:1px solid var(--border);margin-top:32px;padding-top:32px;">

          <script src="https://giscus.app/client.js"
            data-repo="invernofrio/blog-comments"
            data-repo-id="R_kgDORxB1kg"
            data-category="General"
            data-category-id="DIC_kwDORxB1ks4C5TOQ"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"

  <footer class="footer">
    <div class="container">
      <p>© 2026 InvernoFrio的博客 · 用 Nginx 构建</p>
    </div>
  </footer>

  <script>
    document.querySelector('.menu-toggle').addEventListener('click', () => {
      document.querySelector('.nav-links').classList.toggle('show');
    });

    // TOC 高亮联动
    const tocLinks = document.querySelectorAll('.toc-link');
    const sections = [];
    tocLinks.forEach(link => {
      const id = link.getAttribute('href').replace('#', '');
      const el = document.getElementById(id);
      if (el) sections.push({ el, link });
    });

    function updateToc() {
      let current = sections[0];
      for (const s of sections) {
        if (s.el.getBoundingClientRect().top <= 120) current = s;
      }
      tocLinks.forEach(l => l.classList.remove('active'));
      if (current) current.link.classList.add('active');
    }

    window.addEventListener('scroll', updateToc, { passive: true });
    updateToc();

    tocLinks.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const target = document.getElementById(link.getAttribute('href').replace('#', ''));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  </script>
</body>
</html>
