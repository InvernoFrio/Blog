<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签 - InvernoFrio的博客</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 标签云 */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 20px 0;
    }
    .tag-cloud .tag-item {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--tag-bg);
      color: var(--link);
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }
    .tag-cloud .tag-item:hover {
      background: var(--link);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }
    .tag-cloud .tag-item.active {
      background: var(--link);
      color: #fff;
      border-color: var(--link-hover);
    }
    .tag-cloud .tag-count {
      font-size: 0.75em;
      opacity: 0.7;
      margin-left: 4px;
    }

    /* 标签分组文章 */
    .tag-group {
      margin-bottom: 30px;
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
    }
    .tag-group.visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    .tag-group-title {
      font-size: 1.3em;
      color: var(--text-primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--link);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-group-title .tag-badge {
      background: var(--tag-bg);
      color: var(--link);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75em;
    }
    .tag-group .post-card {
      margin-bottom: 12px;
      background: transparent;
      box-shadow: none;
      border: none;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
    }
    .tag-group .post-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 提示文字 */
    .tag-hint {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 20px;
      font-size: 1.05em;
    }
  </style>  <link rel="alternate" type="application/rss+xml" title="InvernoFrio的博客 RSS" href="feed.xml">
</head>
<body>
  <!-- 模糊导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="logo">🌾 InvernoFrio的博客</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">首页</a></li>
        <li><a href="categories.html">分类</a></li>
        <li><a href="archive.html">归档</a></li>
        <li><a href="search.html">搜索</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="friend-links.html">友链</a></li>
        <li><a href="toolbox.html">百宝箱</a></li>
        <li><a href="contact.html">联系</a></li>
      </ul>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
      </div>
    </div>
  </nav>

  <!-- 封面区域 -->
  <header class="cover">
    <div class="cover-content">
      <h1 class="cover-title" id="pageTitle" data-title="标签"></h1>
      <p class="cover-subtitle">文章标签合集</p>
    </div>
  </header>

  <main class="container article-page">
    <div class="main-grid">
      <section class="posts-list">
        <h2>全部标签</h2>

        <!-- 标签云 -->
        <div class="tag-cloud" id="tagCloud"></div>

        <!-- 标签文章列表 -->
        <div id="tagArticles">
          <p class="tag-hint" id="tagHint">👆 点击上方标签查看对应文章</p>
        </div>
      </section>

      <aside class="sidebar">
        <div class="about-card">
          <h3>关于我</h3>
          <div class="avatar"><img src="img/avatar.jpg" alt="头像"></div>
          <p>一名热爱技术的开发者，喜欢折腾服务器、写代码、偶尔写点东西记录生活。</p>
          <ul class="social-links">
            <li><a href="https://github.com/invernofrio" target="_blank">GitHub</a></li>
            <li><a href="mailto:1580757598@qq.com">Email</a></li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 InvernoFrio的博客 · 用 Nginx 构建 · <a href="http://REDACTED_IP">主站</a></p>
    </div>
  </footer>

  <script>
    let activeTag = null;

    fetch('search-data.json')
      .then(r => r.json())
      .then(articles => {
        const tagMap = {};
        articles.forEach(article => {
          (article.tags || []).forEach(tag => {
            if (!tagMap[tag]) tagMap[tag] = [];
            tagMap[tag].push(article);
          });
        });

        const cloud = document.getElementById('tagCloud');
        const tagNames = Object.keys(tagMap).sort((a, b) => tagMap[b].length - tagMap[a].length);
        const maxCount = Math.max(...tagNames.map(t => tagMap[t].length));

        tagNames.forEach(tag => {
          const count = tagMap[tag].length;
          const el = document.createElement('span');
          el.className = 'tag-item';
          const size = 0.85 + (count / maxCount) * 0.5;
          el.style.fontSize = size + 'em';
          el.innerHTML = tag + '<span class="tag-count">' + count + '</span>';
          el.dataset.tag = tag;
          el.addEventListener('click', () => toggleTag(tag, el));
          cloud.appendChild(el);
        });

        const container = document.getElementById('tagArticles');
        tagNames.forEach(tag => {
          const group = document.createElement('div');
          group.className = 'tag-group';
          group.id = 'tag-group-' + tag.replace(/\s+/g, '-');
          const title = document.createElement('h3');
          title.className = 'tag-group-title';
          title.innerHTML = '🏷️ ' + tag + ' <span class="tag-badge">' + tagMap[tag].length + ' 篇</span>';
          group.appendChild(title);
          tagMap[tag].sort((a, b) => b.date.localeCompare(a.date)).forEach(article => {
            const card = document.createElement('article');
            card.className = 'post-card';
            card.innerHTML = '<h3><a href="' + article.url + '">' + article.title + '</a></h3>' +
              '<p class="excerpt">' + article.excerpt + '</p>' +
              '<p class="meta">📅 ' + article.date + ' · 📂 ' + article.category + '</p>' +
              '<a href="' + article.url + '" class="read-more">阅读全文 →</a>';
            group.appendChild(card);
          });
          container.appendChild(group);
        });

        function toggleTag(tag, el) {
          const hint = document.getElementById('tagHint');
          const allGroups = document.querySelectorAll('.tag-group');
          const allTags = document.querySelectorAll('.tag-item');
          if (activeTag === tag) {
            activeTag = null;
            el.classList.remove('active');
            allGroups.forEach(g => g.classList.remove('visible'));
            if (hint) hint.style.display = '';
            return;
          }
          activeTag = tag;
          allTags.forEach(t => t.classList.remove('active'));
          el.classList.add('active');
          allGroups.forEach(g => g.classList.remove('visible'));
          const target = document.getElementById('tag-group-' + tag.replace(/\s+/g, '-'));
          if (target) target.classList.add('visible');
          if (hint) hint.style.display = 'none';
        }
      })
      .catch(err => {
        console.error('加载标签数据失败:', err);
        document.getElementById('tagCloud').innerHTML = '<p class="tag-hint">加载标签数据失败</p>';
      });
  </script>
  <script src="js/common.js"></script>
</body>
</html>
